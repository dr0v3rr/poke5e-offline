# Single-origin gateway: serve the built SvelteKit site AND reverse-proxy the
# Supabase API + MinIO. Because everything is one origin, there is no CORS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Supabase REST (PostgREST) — poke5e uses RPC only ----
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Supabase Auth (GoTrue) ----
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Supabase Storage (trainer avatars) ----
    location /storage/v1/ {
        proxy_pass http://storage:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Supabase Edge Functions (user-assets) ----
    location /functions/v1/ {
        proxy_pass http://functions:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- MinIO S3 (public bucket reads + presigned uploads) ----
    # The SigV4 signature covers the Host header, so it MUST be forwarded
    # verbatim (host:port exactly as the browser sent it, matching APP_ORIGIN).
    location /user-assets/ {
        proxy_pass http://minio:9000/user-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    # ---- Static SvelteKit site: prerendered pages + SPA fallback ----
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }
}
